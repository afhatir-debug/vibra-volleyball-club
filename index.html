<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibra Junior VC - Official Club Website</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-dark: #334155;
            --card-bg: #ffffff;
            --glass-bg: rgba(15, 23, 42, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #f1f5f9;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* Keyframes Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Header & Navigasi */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            color: var(--text-light);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 1.8rem;
            color: var(--accent);
            animation: float 3s ease-in-out infinite;
        }

        .logo h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
        }

        nav a:hover {
            color: var(--accent);
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.88)), 
                        url('https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            color: var(--text-light);
            text-align: center;
            padding: 100px 20px 80px;
            position: relative;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--danger);
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 15px;
            animation: pulseGlow 2s infinite;
        }

        .hero h2 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            animation: fadeIn 0.8s ease-out;
        }

        .hero .subtitle {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.05rem;
            max-width: 750px;
            margin: 0 auto 30px;
            color: #94a3b8;
        }

        /* Stat Counter Bar */
        .stats-bar {
            background: var(--secondary);
            border-radius: 15px;
            max-width: 950px;
            margin: -40px auto 40px;
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            z-index: 10;
            color: white;
        }

        .stat-item h3 {
            font-size: 2rem;
            color: var(--accent);
            font-weight: 800;
        }

        .stat-item p {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* Section Container */
        .container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 0 20px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-size: 2rem;
            color: var(--primary);
            font-weight: 800;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60%;
            height: 4px;
            background: var(--accent);
            margin: 8px auto 0;
            border-radius: 2px;
        }

        /* Highlight Special Box */
        .highlight-box {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            border: 1px solid rgba(245, 158, 11, 0.3);
            animation: fadeIn 1s ease;
        }

        .highlight-content {
            flex: 1;
        }

        .highlight-content h3 {
            color: var(--accent);
            font-size: 1.6rem;
            margin-bottom: 12px;
        }

        .highlight-content p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        /* Filter Controls */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .filter-btn {
            background: white;
            color: var(--primary);
            border: 2px solid #e2e8f0;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: var(--accent);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Characters Grid */
        .grid-characters {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .character-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .character-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.15);
            border-color: var(--accent);
        }

        .character-avatar {
            width: 85px;
            height: 85px;
            background: #f1f5f9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 2.5rem;
            border: 3px solid var(--accent);
            transition: transform 0.3s;
        }

        .character-card:hover .character-avatar {
            transform: scale(1.1) rotate(5deg);
        }

        .character-card h3 {
            color: var(--primary);
            font-size: 1.15rem;
            font-weight: 700;
        }

        .badge-role {
            display: inline-block;
            background: #e2e8f0;
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin: 8px 0;
        }

        .badge-award {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            margin-top: 5px;
            font-weight: 600;
            display: inline-block;
        }

        .click-hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* Modal Dialog Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-card {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            position: relative;
            animation: fadeIn 0.3s ease-out;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--danger);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-avatar {
            width: 90px;
            height: 90px;
            background: #f8fafc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 3rem;
            border: 4px solid var(--accent);
        }

        .modal-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .modal-stat-item p {
            font-size: 0.8rem;
            color: #64748b;
        }

        .modal-stat-item h4 {
            font-size: 1rem;
            color: var(--primary);
        }

        .modal-bio {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #475569;
            line-height: 1.6;
        }

        /* Trophy Table */
        .table-responsive {
            overflow-x: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
        }

        tr {
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .gold-row {
            background-color: #fef3c7 !important;
            font-weight: 600;
        }

        /* Schedule Grid */
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .match-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border-left: 5px solid var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,
